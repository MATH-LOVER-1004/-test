<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 프로그램 모음</title>
  
  <!-- 여기서부터 디자인(꾸미기) 코드입니다 -->
  <style>
    body {
      background-color: #f0f2f5; /* 눈이 편안한 연한 회색 배경 */
      font-family: 'Malgun Gothic', sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #333333;
      margin-bottom: 10px;
    }

    p {
      color: #666666;
      margin-bottom: 40px;
    }

    /* 폴더들을 가로로 나란히 놓는 상자 */
    .folder-container {
      display: flex;
      justify-content: center; /* 가운데 정렬 */
      gap: 30px; /* 폴더 사이의 간격 */
      flex-wrap: wrap;
    }

    /* 개별 폴더(버튼) 디자인 */
    .folder {
      background-color: white;
      width: 200px;
      padding: 30px 20px;
      border-radius: 20px; /* 모서리를 둥글게 */
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* 은은한 그림자 */
      text-decoration: none; /* 링크의 파란 밑줄 없애기 */
      color: #333333;
      transition: transform 0.2s; /* 마우스 올릴 때 움직이는 속도 */
    }

    /* 마우스를 폴더 위에 올렸을 때의 효과 */
    .folder:hover {
      transform: translateY(-10px); /* 위로 살짝 떠오르기 */
      box-shadow: 0 8px 20px rgba(0,0,0,0.2); /* 그림자가 진해짐 */
    }

    /* 폴더 그림(이모지) 크기 */
    .folder-icon {
      font-size: 80px; 
      margin-bottom: 15px;
    }

    /* 파일 이름 글씨 크기 */
    .folder-name {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 화면에 보이는 제목과 설명 -->
  <h1>📁 나의 자리배치 프로그램</h1>
  <p>원하는 폴더를 클릭하면 프로그램이 실행됩니다!</p>

  <!-- 폴더 버튼들 시작 -->
  <div class="folder-container">
    
    <!-- 1. 첫 번째 폴더: 자리바꾸기.html 연결 -->
    <a href="자리바꾸기.html" class="folder">
      <div class="folder-icon">📂</div>
      <div class="folder-name">자리바꾸기</div>
    </a>

    <!-- 2. 두 번째 폴더: 자리배치프로그램(version2.3).html 연결 -->
    <a href="자리배치프로그램(version2.3).html" class="folder">
      <div class="folder-icon">📂</div>
      <div class="folder-name">자리배치 (v2.3)</div>
    </a>

  </div>
  <!-- 폴더 버튼들 끝 -->

</body>
</html>
